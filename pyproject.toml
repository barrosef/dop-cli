[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dop"
version = "0.3.0"
description = "DevOps Pipeline CLI - IA-First development workflow, multi-workspace, multi-platform"
requires-python = ">=3.11"
dependencies = [
    "PyGithub>=2.0",
    "python-gitlab>=4.0",
]

[project.scripts]
dop = "dop.cli:main"
dop-devops = "dop.devops:main"

[tool.setuptools.packages.find]
where = ["src"]
